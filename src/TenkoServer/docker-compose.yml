services:
  tenkoserver:
    build:
      context: ../../
      dockerfile: src/TenkoServer/Dockerfile
    container_name: tenkoserver_app
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TenkoServer__ApiKey=${TENKO_API_KEY:-secret-tenko-api-key-change-me}
      - TenkoServer__AdminPassword=${TENKO_ADMIN_PASSWORD:-admin1234}
      - TenkoServer__StudentsPassphrase=${TENKO_STUDENTS_PASSPHRASE:-}
      - TenkoServer__EmailDomain=${TENKO_EMAIL_DOMAIN:-tokyo.kosen-ac.jp}
      - TenkoServer__PowerAutomateWebhookUrl=${TENKO_POWER_AUTOMATE_WEBHOOK_URL:-}
    volumes:
      - ../../data:/app/data
    networks:
      - tenko_net

  caddy:
    image: caddy:2-alpine
    container_name: tenkoserver_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${SERVER_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tenkoserver
    networks:
      - tenko_net

volumes:
  caddy_data:
  caddy_config:

networks:
  tenko_net:
    driver: bridge
